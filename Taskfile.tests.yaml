version: 3

silent: true

# API testing with Hurl
# Using Hurl instead of curl/Postman for:
# - Version-controlled test files
# - Human-readable format
# - Built-in assertions and JSON path support
# - CI/CD integration

vars:
  API_URL: http://localhost:8000
  HURL_DIR: tests/hurl
  HURL_OPTS: --test --file-root test_files

tasks:
  _ensure-hurl:
    internal: true
    cmds:
      - |
        {{if eq .OS "windows"}}where hurl >NUL 2>&1 || (
          echo hurl command not found. Install it from https://hurl.dev >&2
          exit /b 1
        ){{else}}if ! command -v hurl >/dev/null 2>&1; then
          echo "hurl command not found. Install it from https://hurl.dev" >&2
          exit 1
        fi{{end}}

  default:
    desc: Run all tests
    deps: [health, convert]

  health:
    desc: Test health endpoints
    deps: [_ensure-hurl]
    cmds:
      - hurl {{.HURL_DIR}}/health.hurl {{.HURL_OPTS}}

  convert:
    desc: Test conversion endpoints
    deps: [_ensure-hurl]
    cmds:
      - hurl {{.HURL_DIR}}/convert-single.hurl {{.HURL_OPTS}}
      - hurl {{.HURL_DIR}}/convert-batch.hurl {{.HURL_OPTS}}

  image:
    desc: Test image ingestion with OCR
    deps: [_ensure-hurl]
    cmds:
      - hurl {{.HURL_DIR}}/convert-image.hurl {{.HURL_OPTS}}

  all:
    desc: Run all tests with verbose output
    deps: [_ensure-hurl]
    cmds:
      - hurl {{.HURL_DIR}}/*.hurl {{.HURL_OPTS}} --verbose

  single:
    desc: Run a single test file
    deps: [_ensure-hurl]
    cmds:
      - hurl {{.HURL_DIR}}/{{.FILE}}.hurl {{.HURL_OPTS}} --verbose
    vars:
      FILE: '{{.FILE | default "health"}}'

  report:
    desc: Run tests with HTML report
    deps: [_ensure-hurl]
    cmds:
      - hurl {{.HURL_DIR}}/*.hurl {{.HURL_OPTS}} --report-html tests/report

  check-server:
    desc: Check if API server is running
    cmds:
      - cmd: |
          if curl -s -f {{.API_URL}}/health > /dev/null; then
            echo "API server is running"
          else
            echo "API server is not running. Please start it with 'task start'"
            exit 1
          fi
        platforms: [darwin, linux]
      - cmd: |
          powershell -NoProfile -Command "$resp = Invoke-WebRequest -UseBasicParsing -Uri '{{.API_URL}}/health' -Method GET -TimeoutSec 5; if ($resp.StatusCode -eq 200) { Write-Output 'API server is running' } else { Write-Error 'API server is not running. Please start it with ''task start'''; exit 1 }"
        platforms: [windows]
    silent: false
